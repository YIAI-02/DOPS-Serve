[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dops-serve"
version = "0.1.0"
description = "Fixed-placement serving timing replay and operator placement learning with DOPS"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2"]

[project.scripts]
dops-serve = "dops_serve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
